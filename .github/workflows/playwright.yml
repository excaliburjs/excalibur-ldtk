name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
env:
  DEBUG: pw:webserver
jobs:
  test:
    timeout-minutes: 60
    # The golden-master snapshots are recorded as *-chromium-linux.png, so the e2e job is
    # Linux-only on purpose - running it on another OS would compare against baselines that
    # do not exist.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - run: npm run build
    - name: Install rendering + font packages
      # xvfb gives the browser a real X display (swiftshader still needs one for GL), and the
      # font packages pin text rendering to the same set the baselines were recorded with.
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb fonts-liberation fonts-noto-core
    - run: npx playwright install --with-deps chromium
    - name: Run Playwright e2e tests
      run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" npm run test:e2e
    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30
